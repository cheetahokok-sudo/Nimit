name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Gate the deploy on the same checks used locally — a red build
      # must not reach the public URL.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Project Pages serve from /<repo>/, so the base href must match
      # or every asset request 404s.
      #
      # The Supabase values are repository VARIABLES, not secrets — the anon
      # key ships in the JS bundle by design (RLS is the security model), and
      # variables make rotation a settings change instead of a commit. When
      # the variables are unset the defines are empty and the app stays on
      # mocks, so forks and fresh clones build cleanly.
      - name: Build web
        run: >
          flutter build web --release --base-href /Nimit/
          --dart-define=NIMIT_REMOTE=${{ vars.NIMIT_REMOTE }}
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
