name: Verify database schema

# The rights firewall is enforced in SQL, so SQL changes need the same CI gate
# the Flutter code already has. This applies every migration and seed to a
# fresh PostgreSQL and runs the full assertion suite — twice: once against the
# draft state, then again after publishing, because the two states exercise
# different paths (draft exclusion vs. visible content) and a regression in
# either would otherwise reach production unnoticed.

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  pull_request:
    paths: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nimit_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGURL: postgresql://postgres:ci@localhost:5432/nimit_ci

    steps:
      - uses: actions/checkout@v5

      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Apply seeds
        run: |
          for f in supabase/seed.sql \
                   supabase/seeds/sources_v1.sql \
                   supabase/seeds/sources_v2_research.sql \
                   supabase/seeds/sources_v3_legal_corrections.sql \
                   supabase/seeds/sources_v4_tipitaka.sql \
                   supabase/seeds/sources_v5_wisan_research.sql \
                   supabase/seeds/dream_symbols_v1.sql \
                   supabase/seeds/lottery_reference_v1.sql; do
            echo "== $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Seeds are idempotent (second run must not error or duplicate)
        run: |
          for f in supabase/seeds/sources_v1.sql \
                   supabase/seeds/sources_v2_research.sql \
                   supabase/seeds/dream_symbols_v1.sql \
                   supabase/seeds/lottery_reference_v1.sql; do
            psql "$PGURL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$PGURL" -v ON_ERROR_STOP=1 -t -c "
            do \$\$
            declare n int;
            begin
              select count(*) into n from (
                select edition_id, registry_ref from editorial.acquisition
                group by 1,2 having count(*) > 1) d;
              if n > 0 then
                raise exception 'seed re-run duplicated % acquisition pairs', n;
              end if;
            end \$\$;"

      - name: Assertion suite (draft state)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/rights_firewall_test.sql

      - name: Publish safe layer
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/publish_v1.sql

      # Runs after publish because it publishes its own passage and rows,
      # which requires the work/edition provenance chain to be published first.
      - name: Apply first content set (Mahasupina interpretations)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v1.sql

      - name: Apply second content set (Subina Sutta interpretations)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v2_subinasutta.sql

      # After the content sets: its horse interpretation attaches to the
      # Mahasupina passage created in interpretations_v1.
      - name: Apply lexicon gap-fill (horse, dragon, shark terms)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/dream_symbols_v2_gapfill.sql

      - name: Apply plain-language summaries
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v3_plain_summaries.sql

      - name: Apply lexicon v3 (colors, weather, numbers-as-objects)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/dream_symbols_v3_colors_weather.sql

      # First folk-belief source: registration, body-omen lexicon, content.
      - name: Apply folk source (ประมวลตำราทำนาย 2477)
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/sources_v6_pramuan.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/dream_symbols_v4_body_omens.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v4_krachamen.sql

      # Second กระเหม่น page from the same PD source: new omen symbols plus
      # readings that carry the 2477 verse verbatim (lawful — public domain).
      - name: Apply krachamen p.24 lexicon and content
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/dream_symbols_v5_krachamen_p24.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v6_krachamen_p24.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v7_khamthamnaifan.sql

      # Owned-library workflow: holdings, corrected classifications, template.
      - name: Apply owned-library sources and template
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/sources_v7_owned_library.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v5_owned_books_template.sql

      # Animal lexicon the owned-book numbers attach to, plus retirement of the
      # placeholder rows that book has now superseded.
      - name: Apply animal lexicon and retire placeholders
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/dream_symbols_v6_animals.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v8_retire_placeholders.sql
          # Exercised even though CI has no number payload (those live outside
          # the repo): it must stay runnable and idempotent on an empty set.
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/dream_symbols_v7_p11_p12.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v9_p11_p12.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v10_p13.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/publish_v2_numbers.sql

      # Closes the dream section of ประมวลตำราทำนาย (หน้า ๑๔–๑๗), then opens the
      # first astrology-taksa content from พรหมชาติ ๒๕๐๖.
      #
      # These three shipped without a CI step. That is the failure mode this
      # gate exists to prevent: taksa_v1 publishes readings and asserts its own
      # rights invariants, so an upstream change breaking it would have been
      # caught by nothing until it reached the live database by hand.
      - name: Apply p.14–17 lexicon, content, and ทักษาวันเกิด
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/dream_symbols_v8_p14_p17.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v11_p14_p17.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/taksa_v1_phrommachat_2506.sql

      # The seed that registers a reading entitlement must be idempotent, or
      # re-running it duplicates the holding that documents why our editorial
      # work on a copyrighted book is lawful.
      - name: Apply owned พรหมชาติ registration (twice — must be idempotent)
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/sources_v8_phrommachat_owned.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/sources_v8_phrommachat_owned.sql

      # First content from the owned compilation, and the first ever in
      # folk-brahmajati. Applied twice for the same reason as above: it stages a
      # temp table and inserts through joins, so a second run must be a no-op
      # rather than a duplicate cycle.
      - name: Apply ปีนักษัตร lexicon and draft readings (twice)
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/zodiac_v1_phrommachat_owned.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/zodiac_v1_phrommachat_owned.sql

      # The age wheel (หน้า ๑–๓) is independent of the zodiac material; the
      # เดือนเกิด subdivisions build on zodiac_v1's symbols and must follow it.
      # Both applied twice: each stages a temp table and inserts through joins.
      - name: Apply วงราศีตามอายุ and เดือนเกิด subdivisions (twice)
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/agewheel_v1_phrommachat_owned.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/agewheel_v1_phrommachat_owned.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/zodiac_v2_month_groups.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/zodiac_v2_month_groups.sql

      # ตำรับทำนายฝัน ๑๐๘ ข้อ (หน้า ๒๒๗–๒๓๑) — the first dream material from the
      # owned compilation. Lexicon before readings: the 16 new symbols are
      # draft, and interpretations_v12 joins them by concept_key, so the reverse
      # order silently loses 16 of its 63 rows.
      #
      # Applied twice: both files insert through joins over a VALUES CTE, so a
      # second run must be a no-op rather than a duplicate set. Each carries its
      # own count assertion, which is what makes the second run meaningful — a
      # duplicate would push the count past 63 and raise.
      - name: Apply ๑๐๘ ข้อ dream lexicon and draft readings (twice)
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/dream_symbols_v9_phrommachat_108.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/dream_symbols_v9_phrommachat_108.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v12_phrommachat_108.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seeds/interpretations_v12_phrommachat_108.sql

      # The refusal is the point of the file, so assert it rather than trust the
      # seed's own guard: nothing from this mixed compilation may be published
      # without a second witness, and เครื่องบิน may never carry a reading from
      # it at all.
      - name: ๑๐๘ ข้อ stays unpublished, and เครื่องบิน stays empty
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -t -c "
            do \$\$
            declare bad int;
            begin
              select count(*) into bad
                from content.interpretation i
                join content.passage p on p.id = i.passage_id
                join content.edition e on e.id = p.edition_id
               where e.citekey = 'phrommachat-owned'
                 and p.sequence between 227 and 231
                 and i.status = 'published'
                 and coalesce(array_length(i.corroborating_edition_ids, 1), 0) < 1;
              if bad > 0 then
                raise exception '% ๑๐๘-ข้อ reading(s) published with no second witness', bad;
              end if;

              select count(*) into bad
                from content.interpretation i
                join content.symbol s on s.id = i.symbol_id
                join content.passage p on p.id = i.passage_id
                join content.edition e on e.id = p.edition_id
               where s.concept_key = 'DREAM_AIRPLANE'
                 and e.citekey = 'phrommachat-owned';
              if bad > 0 then
                raise exception 'เครื่องบิน carries a reading from the compilation — '
                  'ข้อ ๓๒/๓๓ are the compiler''s own modern text';
              end if;
            end \$\$;"

      # The API function the app actually calls. Exercised rather than trusted:
      # the counting rule is arithmetic, and arithmetic nobody runs is a guess.
      - name: วงราศีตามอายุ API answers, and fails closed
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -t -c "
            do \$\$
            declare m text; f text;
            begin
              select api.agewheel_age(1)->'male'->>'slug' into m;
              select api.agewheel_age(1)->'female'->>'slug' into f;
              if m <> 'age-wheel-chedi' or f <> 'age-wheel-chedi' then
                raise exception 'age 1 must land on chedi both ways, got % / %', m, f;
              end if;
              select api.agewheel_age(2)->'female'->>'slug' into f;
              if f <> 'age-wheel-naga-king' then
                raise exception 'age 2 female must step backwards to naga-king, got %', f;
              end if;
              if api.agewheel_age(0) is not null or api.agewheel_age(999) is not null then
                raise exception 'agewheel must fail closed on an out-of-range age';
              end if;
              if jsonb_array_length(api.agewheel_age(36)->'male'->'readings') <> 0 then
                raise exception 'agewheel returned a reading that is still draft';
              end if;
            end \$\$;"

      # ปีนักษัตร: the index mapping and the เดือนเกิด routing. The routing is
      # checked with the readings TEMPORARILY published inside a rolled-back
      # transaction, because with everything at draft the function returns empty
      # lists for every month and a wrong mapping would look identical to a
      # right one. เดือนอ้าย is the case that matters — it is month 1 but belongs
      # to the ๑๑-๑๒-อ้าย group, so it wraps the year end.
      - name: ปีนักษัตร API maps years and routes เดือนเกิด
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -t -c "
            do \$\$
            declare n int; s text;
            begin
              if api.zodiac_year(0,null)->>'slug' <> 'year-rat'
                 or api.zodiac_year(11,null)->>'slug' <> 'year-pig' then
                raise exception 'zodiac index mapping is shifted';
              end if;
              if api.zodiac_year(12,null) is not null then
                raise exception 'zodiac index must fail closed, not wrap';
              end if;
            end \$\$;"
          psql "$PGURL" -v ON_ERROR_STOP=1 -t -c "
            begin;
            update content.interpretation i set status = 'published'
              from content.symbol s where s.id = i.symbol_id
               and s.concept_key = 'ZODIAC_RAT';
            do \$\$
            declare m int; n int; body text;
            begin
              for m in 1..12 loop
                select jsonb_array_length(api.zodiac_year(0,m)->'monthReadings')
                  into n;
                if n <> 1 then
                  raise exception 'เดือน % matched % month readings, expected exactly 1', m, n;
                end if;
              end loop;
              select api.zodiac_year(0,1)->'monthReadings'->0->>'bodyTh' into body;
              if body not like '%เดือนอ้าย%' then
                raise exception 'เดือนอ้าย must route to the ๑๑-๑๒-อ้าย group';
              end if;
            end \$\$;
            rollback;"

      - name: Assertion suite (published state)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/rights_firewall_test.sql

      # The editorial sweep on a fully-populated library. It writes advisory
      # findings only and changes no status — but a BLOCKER means content that
      # is already published breaks a rule the project committed to, which is
      # exactly the thing that must never reach users quietly.
      - name: Editorial review sweep (no blockers permitted)
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f scripts/review-checks.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -t -c "
            do \$\$
            declare n int;
            begin
              select count(*) into n from editorial.review_finding
               where severity = 'blocker' and not resolved;
              if n > 0 then
                raise exception '% blocking review finding(s) — see editorial.review_finding', n;
              end if;
            end \$\$;"

      # Proves the desk regenerates from a real database, so it can never drift
      # into a hand-maintained page showing numbers nobody can reproduce.
      - name: Review desk regenerates
        run: |
          psql "$PGURL" -t -A -f scripts/review-dump.sql > /tmp/review.json
          node scripts/build-review-desk.mjs /tmp/review.json > /tmp/desk.html
          test -s /tmp/desk.html
          grep -q 'โต๊ะตรวจทาน' /tmp/desk.html
