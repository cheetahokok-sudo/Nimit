name: nimit
description: "นิมิต — ฝัน ดวง ความเชื่อ | Thai dream, belief & lottery companion."
publish_to: 'none'
# 1.0.0 because this is the submission candidate, not because the library is
# finished — it is not. What changed is the claim being made: a version on the
# App Store says "this is the product", and 0.1.0 on a public listing reads as
# unfinished to every user who sees it.
#
# It also has to be 1.0.0 to ship at all. App Store Connect already holds an
# "iOS App Version 1.0" record in Prepare for Submission, and a build can only be
# attached to a version whose string matches — so the 0.1.0 builds already on
# TestFlight could never have been submitted against it. Keep this and the ASC
# version string identical; three digits here because pub requires semver, so the
# ASC record is the side that moves to 1.0.0.
#
# The build number is overridden by $BUILD_NUMBER in codemagic.yaml, so the +1 is
# nominal — CI is the source of truth for it.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  http: ^1.6.0
  intl: ^0.20.2
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  thai_lunar: ^0.1.0
  # Opens the privacy and support pages in the browser, from แหล่งอ้างอิง.
  # Externally, not in a web view: a policy page whose address bar the reader
  # cannot see is worth less than one they can.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Parses codemagic.yaml in test/codemagic_config_test.dart. A CI config is only
  # exercised by pushing a tag, and a tag is a deliberate release — so a typo in
  # it costs a build and a version number instead of a red suite. Test-only; it
  # is not linked into the app.
  yaml: ^3.1.3

flutter:
  uses-material-design: true
  assets:
    # Noto Sans Thai bundled so the all-Thai UI never depends on
    # fonts.gstatic.com at runtime. The google_fonts package finds these by
    # filename and skips the network fetch; main.dart also disables runtime
    # fetching outright, so offline/PWA loads and blocked-CDN networks render
    # correctly instead of falling back to Latin glyphs.
    - assets/google_fonts/
