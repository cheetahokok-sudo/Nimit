# ============================================================================
# Codemagic — iOS build and TestFlight delivery for นิมิต.
#
# ONE NON-NEGOTIABLE IN THIS FILE. The app defaults to mock repositories, and
# a release built without the remote dart-defines ships demo lottery data on a
# money screen — a fixture draw labelled (ตัวอย่าง), presented on real phones
# to real players. The guard step fails the build outright if the backend
# variables are missing, because that binary must not be buildable by
# accident, only refusable on purpose.
#
# SETUP REQUIRED IN THE CODEMAGIC UI (once):
#   * An App Store Connect API key with App Manager role, added under
#     Settings → Integrations → Developer Portal → Manage keys. Used for
#     signing AND TestFlight upload. The key referenced below is named
#     `GrowSense ASC Key` — an ASC API key authorises an Apple TEAM, not one
#     app, and นิมิต ships under the same team, so it already covers
#     app.nimit.nimit. The name is another product's only because keys cannot
#     be renamed in the UI; if นิมิต ever moves to its own Apple account, add
#     a key here and change the one line below.
#   * Environment group `nimit_backend` holding:
#       NIMIT_REMOTE        true
#       SUPABASE_URL        https://<project>.supabase.co
#       SUPABASE_ANON_KEY   <publishable anon key — safe in a client binary;
#                            RLS and the api schema grants are the boundary>
#   * Bundle id app.nimit.nimit registered in the developer portal, and the
#     app record created in App Store Connect.
#
# The anon key is public by design (it ships inside every client). It still
# lives in a variable group rather than this file so rotating it is a UI
# change, not a commit.
# ============================================================================

workflows:
  ios-testflight:
    name: iOS · test, build, TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: 'GrowSense ASC Key'

    environment:
      groups:
        - nimit_backend
      # Pinned to the version the suite is green on. If a macOS image cannot
      # install this exact build the workflow fails in setup, which is the
      # intended outcome: a silent drift to whatever `stable` means this week
      # is worse than a fast, loud failure. Change it deliberately, and only
      # after the suite is green on the new version locally.
      flutter: 3.44.2
      xcode: latest
      # THIS BLOCK'S ERROR MESSAGE LIES, AND IT COST FIVE BUILDS. Read this
      # before you believe what a failing signing step tells you.
      #
      # Builds #1–#4 died in SETUP — before any script ran, with no step log at
      # all — on:
      #
      #   No matching profiles found for bundle identifier "app.nimit.nimit"
      #   and distribution type "app_store"
      #
      # That message points at the provisioning profile. It is not the profile.
      # Creating the profile by hand in the developer portal changed nothing,
      # and neither did waiting an hour for Apple's API to catch up.
      #
      # The actual cause: Codemagic held no code signing CERTIFICATE. The Apple
      # portal had one distribution certificate, created long ago by an API key
      # for another app, whose private key lived only on the machine that made
      # it. A certificate downloaded from Apple carries the public half only, so
      # Codemagic had nothing it could sign with — and reported that as a
      # missing profile.
      #
      # Proving it took moving signing into a script step, where
      # `app-store-connect fetch-signing-files --create` said what was actually
      # wrong: "Cannot save Signing Certificates without certificate private
      # key". Settings → Code signing identities then confirmed it in one line:
      # "No certificates shared with the team".
      #
      # The fix was in the UI, not this file: generate an Apple Distribution
      # certificate in Codemagic (Settings → Code signing identities → iOS
      # certificates → Generate certificate), so Codemagic generates the keypair
      # and KEEPS the private key. It is stored as `ios-distribution`.
      #
      # ios_signing is restored because consuming that stored identity is
      # precisely what it does; the raw CLI cannot, since it fetches the
      # certificate from Apple and would need the private key passed in by hand.
      #
      # If this ever fails with "No matching profiles found" again, check for a
      # certificate FIRST. Apple allows two Apple Distribution certificates per
      # account and both are now used, so the answer will be to fix or re-share
      # an existing one, not to generate a third.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.nimit.nimit
      vars:
        APP_DIR: app

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-v*'    # deliberate releases only — a tag is an act,
          include: true        # a push to main is not

    scripts:
      - name: Guard — refuse a mock-data store binary
        script: |
          set -e
          if [ "$NIMIT_REMOTE" != "true" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "FATAL: backend variables missing (group nimit_backend)."
            echo "A binary built without them ships demo lottery results to real users."
            exit 1
          fi

      - name: Guard — no privileged key in the app tree
        script: |
          set -e
          if grep -ri --include='*.dart' --include='*.yaml' --include='*.plist' \
               -e 'service_role' -e 'SUPABASE_SERVICE' "$APP_DIR"; then
            echo "FATAL: privileged key material referenced in the app tree."
            exit 1
          fi

      - name: Analyze and test
        working_directory: app
        script: |
          set -e
          flutter pub get
          flutter analyze
          flutter test

      # `ios_signing` above fetches the stored certificate and the provisioning
      # profile and loads them into the keychain, but it does NOT write them into
      # the Xcode project — that is this command's job, and it is also what
      # generates the export_options.plist the build step reads by path. Without
      # it the archive is unsigned and the build fails on a file that was never
      # created. Runs after the test gate on purpose: no point signing a binary
      # the suite has not cleared.
      - name: Apply signing profiles to the Xcode project
        working_directory: app
        script: |
          set -e
          xcode-project use-profiles

      - name: Build signed IPA
        working_directory: app
        script: |
          set -e
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=NIMIT_REMOTE=$NIMIT_REMOTE \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration    # singular — the plural is not a valid value
        submit_to_testflight: true
        # App Store submission stays manual: TestFlight is for finding out
        # what a first Thai user actually experiences before review does.
